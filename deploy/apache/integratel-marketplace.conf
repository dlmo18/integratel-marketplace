# VirtualHost de Apache2 para Integratel Marketplace (reverse proxy).
#
# Las apps corren como procesos Node con PM2 en:
#   - frontend-public  -> 127.0.0.1:3000  (raíz del dominio)
#   - backend (NestJS)  -> 127.0.0.1:3002  (bajo /api)
#   - frontend-manager -> 127.0.0.1:3001  (subdominio manager.*)
#
# Este VirtualHost es INDEPENDIENTE: no toca las otras webs ya instaladas.
# Solo responde para el ServerName indicado. Ajusta el dominio.
#
# Requiere módulos: proxy, proxy_http, headers, rewrite
#   sudo a2enmod proxy proxy_http headers rewrite
#
# Instalar:
#   sudo cp deploy/apache/integratel-marketplace.conf /etc/apache2/sites-available/
#   sudo a2ensite integratel-marketplace
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName marketplace.tudominio.com
    # ServerAlias www.marketplace.tudominio.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    # API del backend (NestJS) -> puerto 3002
    ProxyPass        /api  http://127.0.0.1:3002/api
    ProxyPassReverse /api  http://127.0.0.1:3002/api

    # Sitio público (Next.js) -> puerto 3000
    ProxyPass        /  http://127.0.0.1:3000/
    ProxyPassReverse /  http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/integratel_error.log
    CustomLog ${APACHE_LOG_DIR}/integratel_access.log combined
</VirtualHost>

# Panel administrador en un subdominio propio -> puerto 3001
<VirtualHost *:80>
    ServerName manager.marketplace.tudominio.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /  http://127.0.0.1:3001/
    ProxyPassReverse /  http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/integratel_manager_error.log
    CustomLog ${APACHE_LOG_DIR}/integratel_manager_access.log combined
</VirtualHost>

# ==== HTTPS (recomendado) ====
# Tras validar el proxy en :80, habilita TLS con Certbot:
#   sudo apt-get install -y certbot python3-certbot-apache
#   sudo certbot --apache -d marketplace.tudominio.com -d manager.marketplace.tudominio.com
# Certbot crea automáticamente los VirtualHost *:443 y la redirección 80->443.
