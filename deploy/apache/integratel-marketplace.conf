# VirtualHost de Apache2 para Integratel Marketplace (reverse proxy).
#
# Las apps corren como procesos Node con PM2 en:
#   - frontend-public  -> 127.0.0.1:3000  (movistar.davidmolinaojeda.com)
#   - frontend-manager -> 127.0.0.1:3001  (movistar-admin.davidmolinaojeda.com)
#   - backend (NestJS)  -> 127.0.0.1:3002  (movistar-api.davidmolinaojeda.com, bajo /api)
#
# Cada dominio es un VirtualHost INDEPENDIENTE: no toca las otras webs ya
# instaladas. Solo responde para el ServerName indicado.
#
# Requiere módulos: proxy, proxy_http, headers, rewrite
#   sudo a2enmod proxy proxy_http headers rewrite
#
# Instalar:
#   sudo cp deploy/apache/integratel-marketplace.conf /etc/apache2/sites-available/
#   sudo a2ensite integratel-marketplace
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# ============================================================================
# Sitio público (Next.js) -> puerto 3000
# ============================================================================
<VirtualHost *:80>
    ServerName movistar.davidmolinaojeda.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /  http://127.0.0.1:3000/
    ProxyPassReverse /  http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/movistar_public_error.log
    CustomLog ${APACHE_LOG_DIR}/movistar_public_access.log combined
</VirtualHost>

# ============================================================================
# Panel administrador (Next.js) -> puerto 3001
# ============================================================================
<VirtualHost *:80>
    ServerName movistar-admin.davidmolinaojeda.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /  http://127.0.0.1:3001/
    ProxyPassReverse /  http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/movistar_admin_error.log
    CustomLog ${APACHE_LOG_DIR}/movistar_admin_access.log combined
</VirtualHost>

# ============================================================================
# API del backend (NestJS) -> puerto 3002 (prefijo global /api)
# ============================================================================
<VirtualHost *:80>
    ServerName movistar-api.davidmolinaojeda.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /  http://127.0.0.1:3002/
    ProxyPassReverse /  http://127.0.0.1:3002/

    ErrorLog  ${APACHE_LOG_DIR}/movistar_api_error.log
    CustomLog ${APACHE_LOG_DIR}/movistar_api_access.log combined
</VirtualHost>

# ==== HTTPS (recomendado) ====
# Tras validar el proxy en :80, habilita TLS con Certbot:
#   sudo apt-get install -y certbot python3-certbot-apache
#   sudo certbot --apache \
#     -d movistar.davidmolinaojeda.com \
#     -d movistar-admin.davidmolinaojeda.com \
#     -d movistar-api.davidmolinaojeda.com
# Certbot crea automáticamente los VirtualHost *:443 y la redirección 80->443.
