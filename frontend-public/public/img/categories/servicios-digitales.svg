<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Servicios digitales">
  <defs>
    <linearGradient id="bgsd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f9c"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgsd)"/>
  <circle cx="140" cy="120" r="140" fill="#ffffff" opacity="0.08"/>
  <!-- Ventana de software + llave de licencia -->
  <g transform="translate(260,150)">
    <rect x="0" y="0" width="280" height="200" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="280" height="40" rx="16" fill="#0b4f9c"/>
    <circle cx="28" cy="20" r="7" fill="#ffffff"/>
    <circle cx="52" cy="20" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="76" cy="20" r="7" fill="#ffffff" opacity="0.5"/>
    <!-- Cuadrícula estilo apps -->
    <g fill="#06b6d4">
      <rect x="40" y="70" width="55" height="55" rx="10"/>
      <rect x="115" y="70" width="55" height="55" rx="10"/>
      <rect x="190" y="70" width="55" height="55" rx="10"/>
      <rect x="40" y="135" width="55" height="40" rx="10" opacity="0.6"/>
      <rect x="115" y="135" width="55" height="40" rx="10" opacity="0.6"/>
      <rect x="190" y="135" width="55" height="40" rx="10" opacity="0.6"/>
    </g>
  </g>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">Servicios digitales</text>
</svg>
