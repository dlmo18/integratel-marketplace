<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Movistar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#019DF4"/>
      <stop offset="1" stop-color="#00337A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="110" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="520" r="120" fill="#ffffff" opacity="0.08"/>
  <!-- Smartphone -->
  <g transform="translate(300,150)">
    <rect x="0" y="0" width="200" height="320" rx="28" fill="#0b1a3a" stroke="#ffffff" stroke-width="6"/>
    <rect x="18" y="40" width="164" height="240" rx="10" fill="#019DF4" opacity="0.35"/>
    <rect x="70" y="16" width="60" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="100" cy="300" r="9" fill="#ffffff" opacity="0.5"/>
    <!-- Signal waves -->
    <g stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M70 150 a40 40 0 0 1 60 0" transform="translate(-30,-20)"/>
      <path d="M55 165 a60 60 0 0 1 90 0" transform="translate(-30,-20)"/>
    </g>
    <circle cx="100" cy="150" r="8" fill="#ffffff"/>
  </g>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">Movistar</text>
</svg>
