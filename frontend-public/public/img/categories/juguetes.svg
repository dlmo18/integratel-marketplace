<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Juguetes">
  <defs>
    <linearGradient id="bgj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc531"/>
      <stop offset="1" stop-color="#f08a00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgj)"/>
  <circle cx="660" cy="130" r="130" fill="#ffffff" opacity="0.1"/>
  <!-- Building blocks -->
  <g transform="translate(250,170)">
    <!-- block 1 red -->
    <g transform="translate(0,160)">
      <rect x="0" y="0" width="130" height="110" rx="8" fill="#e8402f"/>
      <circle cx="35" cy="-12" r="16" fill="#e8402f"/>
      <circle cx="95" cy="-12" r="16" fill="#e8402f"/>
    </g>
    <!-- block 2 blue -->
    <g transform="translate(150,160)">
      <rect x="0" y="0" width="130" height="110" rx="8" fill="#019DF4"/>
      <circle cx="35" cy="-12" r="16" fill="#019DF4"/>
      <circle cx="95" cy="-12" r="16" fill="#019DF4"/>
    </g>
    <!-- block 3 green on top -->
    <g transform="translate(75,30)">
      <rect x="0" y="0" width="130" height="110" rx="8" fill="#5CB615"/>
      <circle cx="35" cy="-12" r="16" fill="#5CB615"/>
      <circle cx="95" cy="-12" r="16" fill="#5CB615"/>
    </g>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#1b2748">Juguetes</text>
</svg>
