    <path d="M-30 190 H330 L360 240 H-60 Z" fill="#1b2748" stroke="#ffffff" stroke-width="5"/>
  </g>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">Tecnología</text>
